name: Renovate

on:
  schedule:
    - cron: "0 0 * * *"  # cada día a las 00:00 UTC --> 02:00 de la madrugada en España
  workflow_dispatch: 

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v40.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
