name: Renovate

on:
  workflow_dispatch: 

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      LOG_LEVEL: debug
      RENOVATE_AUTODISCOVER: true
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v40.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
